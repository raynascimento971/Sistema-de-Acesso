<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria</title>
    <link rel="stylesheet" href="style.css">
</head>    
<body>
    <h1>Cadastros de Acesso</h1>

    <form>
        <label for="tipo">Tipo de acesso</label>
        <select id="tipo">
            <option value="morador">Morador</option>
            <option value="visitante">Visitante</option>
            <option value="prestador">Prestador de serviço</option>
        </select>

            <div id="campo-servico">
                <label for="servicos"> Serviços </label>

                <select id="servicos">
                
                        <option value="entregador">Entregador</option>
                        <option value="manutencao">Manutenção</option>
                        <option value="outros">Outros</option>
                    
                </select>
            </div>

        <label for="nome"> Nome Completo</label>
        <input id="nome" type="text">
        <p id="nome-error" class="error"></p>

        <label for="rg">RG</label>
        <input id="rg" type="text">

        <label for="cpf">CPF</label>
        <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00">
        <p id="cpf-error" class="error"></p>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="text">

        <label for="casa">Casa</label>
        <input id="casa" type="text">

        <label for="placa">Placa do veículo</label>
        <input id="placa" type="text">

       <div id="campo-aut">
           
           <label for="aut">Quem Autorizou</label>
           <input id="aut" type="text">
           
       </div>

        <button type="button" id="registrar">Registrar entrada</button>

    </form>
    <script src="script.js"></script>
</body>
</html>
