<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria</title>
    <link rel="stylesheet" href="style.css">
</head>    
<body>
    <h1>Cadastros de Acesso</h1>

    <form>
        <label for="tipo">Tipo de acesso</label>
        <select id="tipo">
            <option value="morador">Morador</option>
            <option value="visitante">Visitante</option>
            <option value="prestador">Prestador de serviço</option>
        </select>

        <label for="nome"> Nome Completo</label>
        <input id="nome" type="text">

        <label for="rg">RG</label>
        <input id="rg" type="text">

        <label for="cpf">CPF</label>
        <input id="cpf" type="text">

        <label for="telefone">Telefone</label>
        <input id="telefone" type="text">

        <label for="casa">Casa</label>
        <input id="casa" type="text">

        <label for="placa">Placa do veículo</label>
        <input id="placa" type="text">

        <label for="aut">Quem Autorizou</label>
        <input id="aut" type="text">        


        <button type="button">Registrar entrada</button>

    </form>
</body>
</html>
